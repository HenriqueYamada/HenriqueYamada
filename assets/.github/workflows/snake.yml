name: Generate Amber Contribution Snake

on:
  schedule:
    # roda todo dia às 03:00 UTC — ajuste se quiser outro horário
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG/GIF
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E8A33D&color_dots=%23161310,%232A211A,%23503B24,%23896230,%23E8A33D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E8A33D

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
