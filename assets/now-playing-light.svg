<svg xmlns="http://www.w3.org/2000/svg" width="720" height="245" viewBox="0 0 720 245" role="img" aria-labelledby="title description">
  <title id="title">Tocando agora: Henrique Yuji Yamada</title>
  <desc id="description">Player musical com barra de progresso e equalizador animados em tema claro.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F7FF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A7F37"/><stop offset=".45" stop-color="#0969DA"/><stop offset="1" stop-color="#218BFF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="718" height="243" rx="14" fill="url(#panel)" stroke="#0969DA" stroke-opacity=".4"/>
  <circle cx="32" cy="31" r="5" fill="#0969DA"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="46" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0969DA" letter-spacing="1">TOCANDO AGORA</text>
  <text x="28" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#1F2328">Henrique Yuji Yamada</text>
  <text x="28" y="109" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#0969DA">Full-Stack Developer (em desenvolvimento)</text>
  <text x="28" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#57606A">Transformo código e música em experiências que conectam.</text>
  <rect x="28" y="169" width="490" height="5" rx="2.5" fill="#D0D7DE"/>
  <rect x="28" y="169" width="181" height="5" rx="2.5" fill="url(#blue)" filter="url(#glow)"><animate attributeName="width" values="181;490" dur="12s" repeatCount="indefinite"/></rect>
  <circle cy="171.5" r="5" fill="#218BFF" filter="url(#glow)"><animate attributeName="cx" values="209;518" dur="12s" repeatCount="indefinite"/></circle>
  <text x="28" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#57606A">1:24</text>
  <text x="496" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#57606A">3:47</text>
  <text x="28" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#57606A">PROGRESSO EM LOOP</text>
  <g fill="#0969DA" filter="url(#glow)">
    <rect x="558" y="165" width="7" height="28" rx="3"><animate attributeName="y" values="165;142;165" dur=".8s" repeatCount="indefinite"/><animate attributeName="height" values="28;51;28" dur=".8s" repeatCount="indefinite"/></rect>
    <rect x="570" y="153" width="7" height="40" rx="3"><animate attributeName="y" values="153;128;153" dur="1.1s" repeatCount="indefinite"/><animate attributeName="height" values="40;65;40" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="582" y="139" width="7" height="54" rx="3"><animate attributeName="y" values="139;164;139" dur=".7s" repeatCount="indefinite"/><animate attributeName="height" values="54;29;54" dur=".7s" repeatCount="indefinite"/></rect>
    <rect x="594" y="158" width="7" height="35" rx="3"><animate attributeName="y" values="158;119;158" dur="1.3s" repeatCount="indefinite"/><animate attributeName="height" values="35;74;35" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="606" y="131" width="7" height="62" rx="3"><animate attributeName="y" values="131;151;131" dur=".9s" repeatCount="indefinite"/><animate attributeName="height" values="62;42;62" dur=".9s" repeatCount="indefinite"/></rect>
    <rect x="618" y="149" width="7" height="44" rx="3"><animate attributeName="y" values="149;121;149" dur="1.2s" repeatCount="indefinite"/><animate attributeName="height" values="44;72;44" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="630" y="124" width="7" height="69" rx="3"><animate attributeName="y" values="124;157;124" dur=".75s" repeatCount="indefinite"/><animate attributeName="height" values="69;36;69" dur=".75s" repeatCount="indefinite"/></rect>
    <rect x="642" y="155" width="7" height="38" rx="3"><animate attributeName="y" values="155;135;155" dur="1s" repeatCount="indefinite"/><animate attributeName="height" values="38;58;38" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="654" y="137" width="7" height="56" rx="3"><animate attributeName="y" values="137;166;137" dur=".85s" repeatCount="indefinite"/><animate attributeName="height" values="56;27;56" dur=".85s" repeatCount="indefinite"/></rect>
    <rect x="666" y="161" width="7" height="32" rx="3"><animate attributeName="y" values="161;130;161" dur="1.15s" repeatCount="indefinite"/><animate attributeName="height" values="32;63;32" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="678" y="146" width="7" height="47" rx="3"><animate attributeName="y" values="146;117;146" dur=".95s" repeatCount="indefinite"/><animate attributeName="height" values="47;76;47" dur=".95s" repeatCount="indefinite"/></rect>
  </g>
  <text x="558" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#57606A" letter-spacing="1">WAVEFORM</text>
</svg>
