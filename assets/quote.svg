<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-label="Citação de Alan Turing">
  <rect x="2" y="2" width="1096" height="216" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <text x="550" y="92" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-style="italic" fill="#F0F6FC">We can only see a short distance ahead, but we can see</text>
