  <g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="22" fill="#58A6FF">❝  CITAÇÃO FILOSÓFICA</text><line x1="40" y1="73" x2="1060" y2="73" stroke="#163B52"/><text x="550" y="125" text-anchor="middle" font-size="25" fill="#F0F6FC">“ O que você faz hoje pode melhorar todos os seus amanhãs. ”</text><text x="550" y="166" text-anchor="middle" font-size="18" fill="#58A6FF">— Ralph Marston</text></g>
